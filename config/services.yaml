parameters:

services:
    _defaults:
        autowire: true      
        autoconfigure: true
        bind:
            $projectDir: '%kernel.project_dir%'
    App\:
        resource: '../src/*'
        exclude: '../src/{Migrations,Tests,Kernel.php}'

    App\Controller\:
        resource: '../src/Controller'
        tags: ['controller.service_arguments']

    App\ApiPlatform\CartDataPersister: ~
    App\ApiPlatform\CartDataProvider: ~
